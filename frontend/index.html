<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATLAS — the news, by place</title>
    <meta name="description" content="The news re-projected onto place: every 15 minutes, stories land on the globe where they happen. Conflict, disaster and climate, unrest." />

    <!-- The globe texture is 770 KB; start it with the HTML rather than after the lazy globe chunk. Three.js loads images
         with crossorigin="anonymous", so the preload must match or the browser fetches it twice. -->
    <link rel="preload" as="image" href="%BASE_URL%geo/earth-blue-marble.jpg" crossorigin="anonymous" />

    <!-- Fonts — link preload, not CSS @import, to avoid render blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
