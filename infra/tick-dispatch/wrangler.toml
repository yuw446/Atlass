name = "atlas-tick-dispatch"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false   # cron only: no public URL, so no workers.dev subdomain or route is needed

[triggers]
crons = ["2,17,32,47 * * * *"]

[vars]
REPO = "yuw446/Atlass"
WORKFLOW = "tick.yml"
REF = "main"

# GITHUB_TOKEN is a secret: `npx wrangler secret put GITHUB_TOKEN`

[observability]
enabled = true   # persisted logs: dashboard → Workers → atlas-tick-dispatch → Logs, or wrangler tail
