name = "atlas-tick-dispatch"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true    # a workers.dev URL for /arm and /status; everything else answers 404
preview_urls = false

# Re-arm path only: scheduled() calls arm(), never dispatch(). The Durable Object alarm is the clock (hourly, :02; see
# README). The cron stays on the quarter hours so a dead chain is repaired within 15 minutes.
[triggers]
crons = ["2,17,32,47 * * * *"]

[vars]
REPO = "yuw446/Atlass"
WORKFLOW = "tick.yml"
REF = "main"

# GITHUB_TOKEN is a secret: `npx wrangler secret put GITHUB_TOKEN`

# The clock: one Durable Object holding one alarm, re-armed from alarm(). Free plan (SQLite-backed).
[[durable_objects.bindings]]
name = "TICKER"
class_name = "Ticker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ticker"]

[observability]
enabled = true   # persisted logs: dashboard → Workers → atlas-tick-dispatch → Logs
